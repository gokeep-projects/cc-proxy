name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Set version from tag (bash)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os != 'Windows'
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "Version: $VERSION"
          sed -i.bak "s/\"version\": \"[0-9.]*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json && rm -f src-tauri/tauri.conf.json.bak

      - name: Set version from tag (PowerShell)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        run: |
          $json = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $json.version = "${{ github.ref_name }}" -replace '^v',''
          $json | ConvertTo-Json -Depth 10 | Set-Content src-tauri/tauri.conf.json

      - name: Install frontend deps
        run: pnpm install --no-frozen-lockfile

      - name: Build Tauri
        run: pnpm tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cc-proxy-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.dmg
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f -name "*.exe" -o -name "*.msi" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.dmg" | head -30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "CC Proxy ${{ github.ref_name }}"
          body: |
            ## CC Proxy ${{ github.ref_name }}
            多平台构建包（Windows / Linux / macOS）。
            ### 安装
            - **Windows**: `.exe` / `.msi`
            - **Linux**: `.deb` / `.AppImage`
            - **macOS**: `.dmg`
            ```bash
            cc-proxy --headless --port 9528 --config config.toml
            ```
          draft: false
          prerelease: false
          files: |
            artifacts/*.exe
            artifacts/*.msi
            artifacts/*.deb
            artifacts/*.AppImage
            artifacts/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
